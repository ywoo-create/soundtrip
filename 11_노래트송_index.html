<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>project_main</title>
    <style>
        .background{
            margin: 0;
            background-image: url("");
            background-repeat: no-repeat;
            background-size: cover;
            min-height: 100vh;
        }
        .top-container {
            width: 82%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-right:150px;
            padding: 20px 0;
        
        }
        .top-logo {
            width: 300px;
            height: auto;
            margin-left:100px;
            margin-top: 20px;
        }
        .account {
            font-size:13px;
            font-family: sans-serif; 
            color: #777;
            margin-top:-20px;
        }

        .account a {
            color: black;
            text-decoration: none;
            font-family: sans-serif; 
            
        }

        h1 {
            text-align: center;
            font-size: 60px;
            margin-top: 60px;
            margin-bottom: 40px;
            font-family: sans-serif; 
        }

        .main-search {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 50px;
        }

        .main-search-box {
            width: 700px;
            height: 50px;
            font-size: 15px;
            font-family: sans-serif; 

            border: 1px solid black;
            border-radius: 30px;

            padding: 0 20px;
            margin-right: 10px;
        }

        .main-search-button {
            width: 70px;
            height: 50px;
            font-size: 15px;
            font-family: sans-serif; 

            border: 1px solid black;
            border-radius: 25px;
            background-color: white;
        }
        
        .main-search-button:hover {
            background-color: lightgray;
            }

        .main-search-button:active {
            position: relative;
            top: 2px;
            background-color: gray;
        }

        .middle{
            font-size:18px;
            font-family: sans-serif; 
            margin-left: 310px;
        }
        .country{
            display: flex;
            justify-content: center;

        }

        .country-box {
            width: 250px;
            font-family: sans-serif; 
            font-size:20px;
            border-radius: 20px;
            border: 1px solid rgb(176, 173, 173);
            margin: 10px;
        }
        .country-box:hover{
            box-shadow: 0 3px 7px rgb(211, 209, 209);
        }
        .japan-link {
            color: black;
            text-decoration: none;
        }

        .country-box img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 20px;
        }
        .country-text{
            text-align: center;
            font-family: sans-serif; 
            font-size:15px;
        }
        .second-row {
            margin-top: 30px;
        }
        
        
        footer {
           font-size: 10px;
            bottom: 0;
          
            width: 100%;
            background-color: white;
        }

        hr{
            border: 0.5px solid rgb(176, 173, 173);
        }
       
        
    

        
    </style>
</head>
<body>
    <div class="background">
        <header class="top-bar">
            
        <a href="project_main.html">
            <img src="logo3.png" class="top-logo" alt="SoundTrip 로고">
        </a>

        <div class="account">
            <a href="project_main.html">홈</a> | 로그인 | 회원가입
        </div>

    </header>


    <!-- Tripadvisor처럼 가운데 제목 -->
    <h1>어디로 떠나볼까요?</h1>


    <!-- Tripadvisor처럼 제목 아래 검색창 -->
    <div class="main-search">

        <input type="search"
               class="main-search-box"
               placeholder="검색어를 입력하세요">

        <input type="button"
               class="main-search-button"
               value="검색">

    </div>

        <section>
            <br>
            <p class="middle">음악으로 떠나는 여행, 어디부터 시작할까요?<br>
            마음에 드는 도시를 선택해보세요.</p>
            </section>

        <section>
            <div class="country">
                <div class="country-box">
                    <img src="한국.png" alt="한국">
                    <p class="country-text">한국-부산</p>
                </div>
                <div class="country-box">
                    <img src="미국.png" alt="미국">
                    <p class="country-text">미국-뉴욕</p>
                </div>
                <a href="soundtrip.html" class="japan-link">
                    <div class="country-box">
                        <img src="일본.png" alt="일본">
                        <p class="country-text">일본-도쿄</p>
                    </div>
                </a>
            
                
                <div class="country-box">
                    <img src="프랑스.png" alt="프랑스">
                    <p class="country-text">프랑스-파리</p>
                </div>
            </div>

            <div class="country second-row">

            <div class="country">
                <div class="country-box">
                    <img src="영국 런던.jpg" alt="영국">
                    <p class="country-text">영국-런던</p>
                </div>
                <div class="country-box">
                    <img src="브라질 리우.jpg" alt="브라질">
                    <p class="country-text">브라질-리우</p>
                </div>
                <div class="country-box">
                    <img src="스페인.jpg" alt="스페인">
                    <p class="country-text">스페인-바르셀로나</p>
                </div>
                <div class="country-box">
                    <img src="독일 베를린.jpg" alt="독일">
                    <p class="country-text">독일-베를린</p>
                </div>
            </div>
            </div>
        </section>
        <div class="country second-row"></div>
      
    </div>
    <footer>
        <hr>
        <p>
            이용약관 | 위치기반서비스 이용약관 | 개인정보처리방침 | 청소년보호정책
        </p>
        <p>
            (주)스톤헤드 서울특별시 용산구 청파로47길 100
        </p>
    </footer>
    

</body>
</html>
